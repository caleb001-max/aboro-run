  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0d0a12" />
    <meta name="description" content="ABORO RUN: LAGOS HUSTLE — an original 3D endless runner through Lagos. Run the danfo lanes, dodge wahala, chop coins." />

    <link rel="icon" type="image/png" href="./icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />

  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="vignette"></div>

      <div id="hud" data-testid="hud">
        <div class="hud-top">
          <div class="hud-scoreblock">
            <div class="hud-score" id="hud-score">0</div>
            <div class="hud-sub"><span id="hud-distance">0 m</span><span class="hud-dot">•</span><span id="hud-mult">x1.00</span></div>
          </div>
          <div class="hud-right">
            <div class="pill pill-coin"><span class="ico">₦</span><span id="hud-coins">0</span></div>
            <button class="iconbtn" data-action="pause" aria-label="Pause">❚❚</button>
          </div>
        </div>

        <div class="hud-boosters" id="hud-boosters"></div>

        <div class="hud-bottom">
          <div class="chase" id="hud-chase">
            <div class="chase-label">LHT TASKFORCE</div>
            <div class="chase-track"><div class="chase-fill" id="hud-chase-fill"></div></div>
            <div class="chase-dist" id="hud-chase-dist">far</div>
          </div>
          <div class="hud-hint" id="hud-hint"></div>
        </div>
        <div class="hud-flash" id="hud-flash"></div>
      </div>

      <div id="menus"></div>
      <div id="toasts"></div>
      <div id="fade"></div>
      <div id="rotate-hint">
        <div class="rotate-inner">Turn your phone sideways for more road.<br /><span>Landscape dey sweet pass.</span></div>
      </div>
    </div>
  </body>
